<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ann Arbor VA Glycemic Protocol</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-xl mx-auto bg-white shadow-md rounded px-8 py-6">
    <h1 class="text-2xl font-bold mb-4">Ann Arbor VA Cardiac Anesthesia Intraoperative Glycemic Protocol</h1>
    <form id="glucoseForm" class="space-y-4">
      <div>
        <label class="block font-semibold">Is the patient diabetic?</label>
        <select id="diabetic" class="w-full mt-1 border rounded px-3 py-2">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold">On cardiopulmonary bypass?</label>
        <select id="cpb" class="w-full mt-1 border rounded px-3 py-2">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold">Current blood glucose (mg/dL):</label>
        <input type="number" id="glucose" class="w-full mt-1 border rounded px-3 py-2" required />
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Get Insulin Recommendation
      </button>
    </form>
    <div id="result" class="mt-6"></div>
    <div id="timer" class="mt-4 font-semibold text-red-600"></div>
    <div id="log" class="mt-6">
      <h2 class="text-xl font-semibold mb-2">Glucose Log</h2>
      <ul class="list-disc pl-5 text-sm" id="glucoseLog"></ul>
    </div>
    <button id="crossClampButton" class="fixed bottom-20 right-4 bg-blue-600 text-white px-4 py-2 rounded shadow-lg">⛓️ Cross Clamp Applied</button>
    <button id="protocolSummary" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg">📋 Protocol Summary</button>
  </div>
</body>
</html>
